# BlockWatch - Grundkonfiguration

# Eintraege, die aelter sind, werden einmal taeglich geloescht. 0 = nie loeschen.
retention-days: 180

# Zeitzone fuer die Anzeige von Datum/Uhrzeit.
timezone: Europe/Berlin

# Standard-Radius (in Bloecken, in alle Richtungen) fuer /bw hier und /bw gefahr.
default-radius: 5
max-radius: 50

# Eintraege pro Seite in der Chat-Ausgabe.
page-size: 10

# Gesetzte/abgebaute Bloecke protokollieren (gefaehrliche Aktionen werden immer protokolliert).
log-break: true
log-place: true

# Gefaehrliche Gegenstaende verhindern: Wer (ohne blockwatch.bypass, Standard: OP)
# einen davon setzt oder benutzt, wird gestoppt, protokolliert und kommt ins Gefaengnis.
protection:
  enabled: true
  jail-minutes: 3
  blocked:
    - TNT
    - TNT_MINECART
    - END_CRYSTAL
    - LAVA_BUCKET
    - FLINT_AND_STEEL
    - FIRE_CHARGE
    - RESPAWN_ANCHOR
  # Zelle: ohne Angabe wird beim ersten Bedarf eine Grundgesteinszelle hoch ueber dem
  # Spawn der Hauptwelt gebaut und hier eingetragen. Verschieben mit /bw setjail.
